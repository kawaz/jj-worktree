name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install jj
        run: |
          cargo install jj-cli --locked
          jj --version

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
